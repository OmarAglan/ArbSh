name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / .NET 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: src_csharp/**/*.csproj

      - name: Verify Linux process-group adapter
        if: runner.os == 'Linux'
        run: setsid --version

      - name: Restore
        run: dotnet restore src_csharp/ArbSh.sln

      - name: Audit packages
        run: dotnet list src_csharp/ArbSh.sln package --vulnerable --include-transitive --no-restore

      - name: Build
        run: dotnet build src_csharp/ArbSh.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src_csharp/ArbSh.Test/ArbSh.Test.csproj --configuration Release --no-build --logger "console;verbosity=normal"
